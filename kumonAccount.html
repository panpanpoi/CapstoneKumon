<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KUMON Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="parentAccStyle.css">
</head>
<body>


    <div class="dashboard">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo">
                <h1>KUMON</h1>
                <p>Practice Makes Possibilities</p>
            </div>
            
            <div class="user-profile">
                <div class="user-avatar">RC</div>
                <div class="user-details">
                    <div class="user-name">Ron Celestra</div>
                    <div class="user-role">Parent Account</div>
                </div>
            </div>
            
            <ul class="nav-menu">
            <!-- <li class="nav-item active"><i class="fas fa-home"></i> Dashboard</li>
                <li class="nav-item"><i class="fas fa-calendar-alt"></i> Schedule</li>
                <li class="nav-item"><i class="fas fa-chart-line"></i> Level</li>
                <li class="nav-item"><i class="fas fa-money-bill-wave"></i> Payments</li>
                <li class="nav-item"><i class="fas fa-comments"></i> PTC Meetings</li>-->
                <li><i class="fas fa-home"></i><a href="kumonAccount.html">Home</a></li>
                <li><i class="fas fa-calendar-alt "></i><a href="calendar.html">Calendar</a></li>
                <li><i class="fas fa-chart-line"></i><a href="Level.html">Level</a></li>
                <li><i class="fas fa-money-bill-wave"></i><a href="payments.html">Balance</a></li>
                <li><i class="fas fa-comments"></i><a href="studentPTC.html">PTC Meeting</a></li>
            </ul>

        </div> 
        
        <!-- Main Content -->
        <div class="main-content">
            <!-- Header with user info on right -->
            <div class="header">
                <div class="header-right">
                    <div class="notifications">
                        <i class="fas fa-bell"></i>
                        <span class="badge">3</span>
                    </div>
                    <div class="user-info">
                        <div class="user-avatar">RC</div>
                        <div class="user-name">Ron Celestra</div>
                    </div>
                </div>
            </div>
            
            <!-- Cards in two rows -->
            <div class="card-container">
                <!-- First Row -->
                <div class="card-row">
                    <div class="card">
                        <div class="card-icon"><i class="fas fa-chart-line"></i></div>
                        <div class="card-title">Current Level</div>
                        <div class="card-value">5A</div>
                        <div class="card-subtitle">Mathematics</div>
                    </div>
                    
                    <div class="card">
                        <div class="card-icon"><i class="fas fa-calendar-check"></i></div>
                        <div class="card-title">Next PTC Meeting</div>
                        <div class="card-value">May 24</div>
                        <div class="card-subtitle">2:00 PM - 2:30 PM</div>
                    </div>
                </div>
                
                <!-- Second Row -->
                <div class="card-row">
                    <div class="card">
                        <div class="card-icon"><i class="fas fa-receipt"></i></div>
                        <div class="card-title">Payment Status</div>
                        <div class="card-value paid">Paid</div>
                        <div class="card-subtitle">Next due June 15</div>
                    </div>
                    
                    <div class="card">
                        <div class="card-icon"><i class="fas fa-clipboard-check"></i></div>
                        <div class="card-title">Attendance</div>
                        <div class="card-value">100%</div>
                        <div class="card-subtitle">This month</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
