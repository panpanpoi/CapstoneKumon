<!DOCTYPE html>
<html>
<head>
   
</head>
 <div class="sidebar">
        <div class="logo">
            <h1><a href="kumonAdmin.html">KUMON</a></h1>
            <p>Practice Makes Possibilities</p>
        </div>
    </div>

<body>
    <div>
       <h1>ACCOUNT CREATION</h1>
    </div>
     <div class="user-profile"> 
        <div class="user-avatar"> LR </div>
        <div class="user-details">
            <div class="username"> Luke Reyes</div>
            <div class="user-role"> Admin</div>
        </div>
    <br>

<main>
   <form action="../handler/inputs.php" method="POST">
        <div id="accountType">
            <h3>Select Account type</h3>
            <label for="accountType">Student</label>
            <input type="radio" name="account_type" value="student">
            <label for="accountType">Teacher</label>
            <input type="radio" name="account_type" value="teacher">
            <label for="accountType">Admin</label>
            <input type="radio" name="account_type" value="admin">
        </div>
        <script>
            // Uncheck all account_type radio buttons on page load
            window.addEventListener('DOMContentLoaded', function() {
            var radios = document.getElementsByName('account_type');
            for(var i=0; i<radios.length; i++) {
                radios[i].checked = false;
            }

            });

            // Allow unchecking radio button by clicking again
            document.querySelectorAll('input[name="account_type"]').forEach(radio => {
            radio.addEventListener('mousedown', function(e) {
                if (this.checked) {
                this.wasChecked = true;
                } else {
                this.wasChecked = false;
                }
            });
            radio.addEventListener('click', function(e) {
                if (this.wasChecked) {
                this.checked = false;
                e.preventDefault();
                }
            });
            });
        </script>
        <br>
        <div>
          <label for="fname">*Firstname</label>
          <input type="text" id="fname" name="fname" placeholder="Insert Firstname" required>
          
          <label for="fname">*Middle Initial</label>
          <input type="text" id="mname" name="mname" placeholder="Insert Middle Initial" maxlength="1" size="1">

          <label for="lname">*Lastname</label>
          <input type="text" id="lname" name="lname" placeholder="Insert Lastname" required >
            <br>
            <br>

          <label for="contact">*Contact Number</label><br>
          <input type="text" id="contact" name="contact" placeholder="Insert Contact Number" required>

        </div>
        <div>
            <h3>Address:</h3>
            <label for="street-address">Street:</label>
            <input type="text" id="street-address" name="street" autocomplete="street-address" required><br><br>

            <label for="city">City:</label>
            <input type="text" id="city" name="city" autocomplete="address-level2" required><br><br>

            <label for="state">State/Province/Region:</label>
            <input type="text" id="state" name="state" autocomplete="address-level1" required><br><br>

        </div> 
        <div id ="subject" style="display:none; margin-top:15px;">
            <h3>Select Subject</h3>
            <label for="subject">Math</label>
            <input type="radio" id="subject-math" name="subject" value="math">
            
            <label for="subject-english">English</label>
            <input type="radio" id="subject-english" name="subject" value="english">
         </div>

        <div id="student-plan" style="display:none; margin-top:15px;">
            <h3>Select Tuition Plan</h3>
            <input type="radio" id="plan-a" name="plan" value="A">
            <label for="plan-a">Plan A - php 2,200</label><br>

            <input type="radio" id="plan-b" name="plan" value="B">
            <label for="plan-b">Plan B - php 2,350</label>
        </div>

        <script>
            // Show/Hide Plan selector and subject if student is chosen
            document.querySelectorAll('input[name="account_type"]').forEach(radio => {
                radio.addEventListener('change', function() {
                    if (this.value === "student") {
                        document.getElementById("student-plan").style.display = "block";
                    } else {
                        document.getElementById("student-plan").style.display = "none";
                    }
                     if (this.value === "student") {
                        document.getElementById("subject").style.display = "block";
                    } else {
                        document.getElementById("subject").style.display = "none";
                    }
                });
            });
        </script>

    <div>
        <h3>Account Information</h3>
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" readonly><br><br>

        <label for="password">Password:</label>
        <input type="text" id="password" name="password" readonly><br><br>
    </div>
        <div><button type="submit">Submit</button></div>
    </form>
    <script>
    document.querySelector('form').addEventListener('input', function(e) {
        // Get values
        const fname = document.getElementById('fname').value.trim().toLowerCase();
        const lname = document.getElementById('lname').value.trim().toLowerCase();

        // Generate username and password
        const username = fname + lname + 'kumon-ortigas';
        const password = fname + lname + 'kumon';
        
        // Set visible fields
        document.getElementById('username').value = username;
        document.getElementById('password').value = password;
    });
    document.querySelector('form').addEventListener('submit', function(e) {
        // Remove readonly attributes so values are submitted
        document.getElementById('username').readOnly = false;
        document.getElementById('password').readOnly = false;
    });
    </script>
</main>
</body>


</html>
