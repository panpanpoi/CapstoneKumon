<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Account List</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; margin: 0; }
    .sidebar {
      background: #007BFF;
      color: white;
      padding: 15px;
      margin-bottom: 20px;
    }
    .sidebar .logo h1 {
      margin: 0;
      font-size: 24px;
    }
    .sidebar .logo a {
      color: white;
      text-decoration: none;
    }
    .sidebar p {
      margin: 0;
      font-size: 14px;
    }
    h2 { margin-top: 0; }
    table { border-collapse: collapse; width: 100%; margin-top: 15px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    th { background: #f4f4f4; }
    input[type="text"] {
      margin-top: 10px;
      padding: 8px;
      width: 50%;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 6px 12px;
      margin: 2px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    button:first-child { background: #ffc107; color: #000; } /* Edit */
    button:last-child { background: #dc3545; color: #fff; } /* Delete */
    #flashMessage {
      color: green;
      font-weight: bold;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="logo">
      <h1><a href="kumonAdmin.html">KUMON</a></h1>
      <p>Practice Makes Possibilities</p>
    </div>
  </div>

  <h2>User List</h2>

  <!-- Flash message area -->
  <div id="flashMessage"></div>

  <!-- Search input -->
  <input type="text" id="searchInput" placeholder="Search users...">

  <!-- User table -->
  <table id="userTable">
    <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Surname</th>
          <th>Address</th>
          <th>Contact Number</th>
          <th>Account</th>
          <th>Actions</th>
        </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
  // use relative path from /pages -> /handler
  const API = '../handler/';

  // flash helper
  function flash(msg) {
    const el = document.getElementById('flashMessage');
    el.textContent = msg;
    setTimeout(() => { el.textContent = ''; }, 2500);
  }

  async function loadData(filter = "") {
    try {
      const resp = await fetch(`${API}retrieve.php?search=` + encodeURIComponent(filter));
      const data = await resp.json();

      const tbody = document.querySelector("#userTable tbody");
      tbody.innerHTML = "";

      data.forEach(user => {
        // hide archived users (if column exists)
        if (user.status && user.status !== 'active') return;

        const row = `<tr>
            <td>${user.user_id}</td>
            <td>${user.Name}</td>
            <td>${user.Surname}</td>
            <td>${user.Address}</td>
            <td>${user.mobileNumber}</td>
            <td>${user.account_type}</td>
            <td>
              <button onclick="editUser(${user.user_id})">Edit</button>
              <button onclick="archiveUser(${user.user_id})">Delete</button>
            </td>
          </tr>`;
        tbody.insertAdjacentHTML('beforeend', row);
      });
    } catch (e) {
      console.error(e);
      flash('Failed to load users.');
    }
  }

  function editUser(id) {
    // file lives in /pages
    window.location.href = `editUser.php?id=${id}`;
  }

  async function archiveUser(id) {
    if (!confirm('Archive this user?')) return;
    try {
      const resp = await fetch(`${API}updateUserStatus.php`, {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: `id=${encodeURIComponent(id)}&status=${encodeURIComponent('archived')}`
      });
      const result = await resp.json();
      if (!resp.ok || result.error) throw new Error(result.error || 'Request failed');
      flash('User archived.');
      loadData(); // refresh list
    } catch (e) {
      console.error(e);
      flash('Failed to archive user.');
    }
  }

  // flash from ?success=
  const params = new URLSearchParams(window.location.search);
  const successMsg = params.get('success');
  if (successMsg) {
    flash(successMsg);
    history.replaceState({}, document.title, location.pathname);
  }

  document.getElementById('searchInput').addEventListener('keyup', e => loadData(e.target.value));
  loadData();
</script>
</body>
</html>
